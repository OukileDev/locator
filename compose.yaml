services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV}
      BUSINFO_API_URL: ${BUSINFO_API_URL}
      BUSINFO_API_TOWN: ${BUSINFO_API_TOWN}
      BUS_TRACKER_API_SERVER: ${BUS_TRACKER_API_SERVER}
      BUS_TRACKER_API_PORT: ${BUS_TRACKER_API_PORT}
    expose:
      - 5000
    depends_on:
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:8-alpine
    restart: always
    expose:
      - 6379
    command: redis-server --save 20 1 --loglevel warning --maxmemory 1g --maxmemory-policy allkeys-lru
    mem_limit: 1g
    volumes:
      - cache:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: always
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - TZ=Europe/Paris
      - NODE_ENV=${NODE_ENV}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./conf:/etc/caddy
      - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "echo -e 'GET / HTTP/1.0\\r\\n\\r\\n' | nc -w 1 localhost 80 | head -1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cache:
    driver: local
  caddy_data:
  caddy_config: