services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: ${NODE_ENV}
      REDIS_URL: ${REDIS_URL}
      BUS_TRACKER_API_SERVER: ${BUS_TRACKER_API_SERVER}
      BUS_TRACKER_API_PORT: ${BUS_TRACKER_API_PORT}
    expose:
      - 5000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - test_default

  web:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: always
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - TZ=Europe/Paris
      - NODE_ENV=${NODE_ENV}
      - DOMAIN=${DOMAIN}
    volumes:
      - ./conf:/etc/caddy
      - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "echo -e 'GET / HTTP/1.0\\r\\n\\r\\n' | nc -w 1 localhost 80 | head -1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
  test_default:
    external: true